name: Deploy to GitHub Pages

# Publishes the site (dist/) on GitHub Pages each time main changes, and again every night
# so that the home page shows the photo of the day and past events drop off.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions",
# then Custom domain: morges.info and "Enforce HTTPS" (see README, Déploiement).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # every night, 02:17 in Morges in winter (03:17 in summer)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells the IndexNow search engines (Bing, Yandex, Seznam, Naver…) that the
  # pages changed (IndexNow). Google does not use IndexNow: it reads the sitemap listed in robots.txt.
  # The key is public by design; the same value is published at https://morges.info/<key>.txt.
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule' # the nightly rebuild changes no page worth announcing
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      INDEXNOW_KEY: 589e71e297a02654d96bf9cb3f327e27
    steps:
      - name: Submit the sitemap URLs to IndexNow
        run: |
          sleep 60  # let GitHub Pages serve the new version
          urls=$(curl -fsS https://morges.info/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" --arg key "$INDEXNOW_KEY" \
            '{host: "morges.info", key: $key, keyLocation: ("https://morges.info/" + $key + ".txt"), urlList: $urls}' \
            | curl -sS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -o /dev/null -w 'IndexNow: HTTP %{http_code}\n'
